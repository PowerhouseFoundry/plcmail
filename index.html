<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PLC Mail</title>
    <link rel="stylesheet" href="styles.css?v=20260831-1105" />
</head>
<body>
<div id="loginOverlay" class="overlay">
  <div class="card narrow">
    <div class="login-brand">
      <img src="assets/plc-mail-logo.png" alt="PLC Mail" class="login-logo">
    </div>

    <div class="field">
      <label>Username or email address</label>
      <input id="loginEmail" type="text" placeholder="e.g. alex.carter or alex.carter@plcmail.com" autocomplete="off" autocapitalize="none" spellcheck="false">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
    </div>

    <div class="row">
      <button id="loginBtn" class="btn btn-primary" disabled>Sign in</button>
    </div>

    <div id="loginStatus" class="login-status">Connecting to PLC Mail…</div>
    <div id="loginMsg"></div>
  </div>
</div>

  <div id="modalOverlay" class="overlay hidden"><div id="modalCard" class="card"></div></div>

  <div id="appShell" class="hidden">
    <header class="topbar">
      <div class="brand">
  <img src="assets/plc-mail-logo.png" alt="PLC Mail" class="brand-logo">

</div>
      <label class="search"><span>🔎</span><input id="globalSearch" type="text" placeholder="Search mail"></label>
      <div class="row">
        <button id="topChangePw" class="btn-secondary">Change password</button>
        <div id="avatar" class="avatar">PL</div>
        <button id="logoutBtn" class="btn-secondary">Log out</button>
      </div>
    </header>

    <div id="adminView" class="hidden">
      <div class="layout-admin">
        <aside id="adminSidebar" class="admin-sidebar"></aside>
        <main id="adminMain" class="admin-main"></main>
      </div>
    </div>

    <div id="mailView" class="hidden">
      <div class="mail-layout">
        <aside class="mail-sidebar">
          <button id="newMailBtn" class="new-btn">New message</button>
<div class="folders">
  <button class="folder-btn active" data-folder="inbox">
    <span class="folder-left"><span>📥</span><span>Inbox</span></span>
    <span id="count-inbox" class="count">0</span>
  </button>

  <button class="folder-btn" data-folder="archive">
    <span class="folder-left"><span>📦</span><span>Archive</span></span>
    <span id="count-archive" class="count">0</span>
  </button>

  <button class="folder-btn" data-folder="sent">
    <span class="folder-left"><span>📤</span><span>Sent Items</span></span>
    <span id="count-sent" class="count">0</span>
  </button>

  <button class="folder-btn" data-folder="drafts">
    <span class="folder-left"><span>📝</span><span>Drafts</span></span>
    <span id="count-drafts" class="count">0</span>
  </button>

  <button class="folder-btn" data-folder="junk">
    <span class="folder-left"><span>🛡️</span><span>Junk Email</span></span>
    <span id="count-junk" class="count">0</span>
  </button>

  <button class="folder-btn" data-folder="deleted">
    <span class="folder-left"><span>🗑️</span><span>Deleted Items</span></span>
    <span id="count-deleted" class="count">0</span>
  </button>

  <button class="folder-btn" data-folder="templates">
    <span class="folder-left"><span>🧩</span><span>Templates</span></span>
    <span class="count">Library</span>
  </button>

  <button class="folder-btn" data-folder="calendar">
    <span class="folder-left"><span>📅</span><span>Calendar</span></span>
    <span id="count-calendar" class="count">0</span>
  </button>
</div>
          
        </aside>
        <section class="mail-list-panel">
          <div class="mail-head"><div><h2 id="folderTitle">Inbox</h2><p><span id="messageCount">0</span> messages</p></div><button id="quickComposeBtn" class="tool-btn mobile-compose-shortcut" title="New message">✎ New</button></div>
          <div id="mailList" class="mail-list"></div>
        </section>
        <main class="mail-reader">
          <div class="toolbar">
            <button id="replyBtn" class="tool-btn">↩ Reply</button>
            <button id="forwardBtn" class="tool-btn">↪ Forward</button>
            <button id="archiveBtn" class="tool-btn">📦 Archive</button>
            <button id="deleteBtn" class="tool-btn">🗑 Delete</button>
            <button id="spamBtn" class="tool-btn">🚫 Mark as junk</button>
            <button id="flagBtn" class="tool-btn">⚑ Flag</button>
            <button id="reportBtn" class="tool-btn">⚠ Report suspicious</button>
            <button id="markUnreadBtn" class="tool-btn">✉ Mark unread</button>
            <button id="restoreBtn" class="tool-btn">↩ Restore</button>
            <button id="permanentDeleteBtn" class="tool-btn tool-danger">🗑 Delete permanently</button>
            <button id="hintBtn" class="tool-btn">💡 Hint</button>
          </div>
          <div class="reader-scroll"><div id="readerInner" class="reader-inner"></div></div>
        </main>
      </div>
    </div>
  </div>


<script>
  window.__plcMailStarted = false;
  window.addEventListener('plcmail-ready', () => { window.__plcMailStarted = true; });
  window.addEventListener('plcmail-startup-error', () => { window.__plcMailStarted = true; });
  setTimeout(() => {
    if(window.__plcMailStarted) return;
    const status = document.getElementById('loginStatus');
    const msg = document.getElementById('loginMsg');
    if(status){ status.textContent = 'Could not connect to PLC Mail'; status.className = 'login-status error'; }
    if(msg) msg.innerHTML = '<div class="message warn"><strong>PLC Mail has not loaded.</strong><br>Check the internet connection, refresh the page, or try a current version of Chrome or Edge.</div>';
  }, 8000);
</script>
<script type="module">
  import('./app.js?v=20260831-1105').catch(error => {
    console.error('PLC Mail module failed to load:', error);
    window.__plcMailStarted = true;
    const status = document.getElementById('loginStatus');
    const msg = document.getElementById('loginMsg');
    if(status){ status.textContent = 'Could not connect to PLC Mail'; status.className = 'login-status error'; }
    if(msg) msg.innerHTML = '<div class="message warn"><strong>PLC Mail could not start.</strong><br>Refresh the page. If the problem continues, try a current version of Chrome or Edge.</div>';
  });
</script>
</body>
</html>
